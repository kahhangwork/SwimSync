name: CI

# Runs the backend test suites against a real local Supabase stack on every
# push / PR to main. This is what guards the billing + credit money-path logic.
#
# The frontend-tests job below typechecks (tsc --noEmit) and runs the
# component/unit suites (vitest / jest-expo) for both apps. The typecheck guard
# keeps the baseline green — a new type error fails CI instead of hiding in
# known-broken noise.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Cheap repo-wide invariants that need no toolchain. Kept as its own job so a
  # failure names the rule rather than hiding inside a test run.
  repo-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # G6 compares the allowance with the push's base commit

      # Every UI fixture seeds the ONE local database that all worktrees share,
      # and /session-close forbids `supabase db reset` as cleanup. A fixture with
      # no teardown therefore leaves a session no safe way to clean up. This kept
      # being forgotten — 9 of 13 were missing on 2026-07-26.
      - name: Every UI fixture has a teardown
        run: .claude/skills/run-ui-playwright/drivers/check-teardowns.sh

      # A UUID copied out of a live database breaks on the first `db reset`,
      # and the roundtrip check never resets. Filed twice (§7.163, §7.224).
      - name: No UI fixture or driver carries a captured UUID
        run: .claude/skills/run-ui-playwright/drivers/check-fixture-ids.sh

      # A hardcoded localhost:3000/8081 drives whatever is on the default port —
      # a sibling worktree's build, or nothing. The backlog counted 3; there were 8.
      - name: No UI driver hardcodes a port
        run: .claude/skills/run-ui-playwright/drivers/check-driver-ports.sh

      # A date label built in SQL or Node's en-US says "Sep"; the apps say "Sept".
      # Agrees 11 months a year, then reddens. Written down 3 times, hit 4 (§7.302).
      - name: No UI driver builds a date label outside lib.mjs
        run: .claude/skills/run-ui-playwright/drivers/check-driver-dates.sh

      # A literal test date the marking floor has not passed expires the 1st it does —
      # main went red that way on 2026-10-01 (§7.303). Annotate or derive (§7.305).
      - name: No pgTAP test or UI fixture holds an expiring literal date
        run: scripts/check-test-dates.sh

      # Wave 7: a pgTAP file that touches a date pins the clock (set_config
      # 'swimsync.now') in the exact form, so it can never expire. Required since
      # Wave 7 T5, when all 83 dated files were pinned.
      - name: Every dated pgTAP file pins the clock (G1)
        run: scripts/check-pgtap-clock.sh

      # Wave 7: a migration newer than the clock cutoff reads app_now()/app_today(),
      # never a raw now()/CURRENT_DATE, unless marked `-- clock: stamp`/`-- clock-real:`.
      - name: No new migration reads a raw clock (G2)
        run: scripts/check-migration-clock.sh

      # §7.7: .slice(0, 10) / .split("T")[0] on a timestamp is the UTC date, a day
      # behind SGT before 08:00 — shipped in the engine until 41d9676.
      - name: No edge function takes the UTC date of a timestamp (G3)
        run: scripts/check-functions-sg-date.sh

      # Wave 8: both apps carry the SAME generated Database types (they share no
      # package). A one-sided edit or regen is a lie in one app.
      - name: Both apps' database.types.ts are byte-identical
        run: cmp SwimSyncApp/lib/database.types.ts SwimSyncAdmin/lib/database.types.ts

      # Wave 8: the `any` ratchet. Every file's `any`-family count equals its
      # allowance; no allowance rises above the push's base; database.types is
      # imported with `import type` only (its runtime Constants must not bundle).
      - name: The any-ratchet holds (G6)
        env:
          G6_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$G6_BASE" || "$G6_BASE" =~ ^0+$ ]] || ! git cat-file -e "$G6_BASE^{commit}" 2>/dev/null; then
            export G6_BASE=HEAD~1
          fi
          scripts/check-db-any.sh

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # PINNED, never `latest` (Wave 8): `supabase gen types` output can change between
      # CLI versions, so an unpinned CLI turns G5 red with no schema change. Bump the
      # pin deliberately, together with a regen (scripts/gen-db-types.sh), and never
      # below what CI last ran green on. Keep it equal to ui-drivers.yml.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `supabase start` boots the Docker stack (Postgres/Auth/REST/Storage),
      # applies supabase/migrations/*, and seeds supabase/seed.sql.
      - name: Start Supabase stack
        run: supabase start

      # Wave 8 G5: the committed Database types match the migrations (regenerated
      # here and diffed against both apps), and every NULLABLE_RPC_ARGS override
      # names a real, non-STRICT function and real params. Runs AFTER Vercel has
      # deployed a push, so the real gate is running it locally before the push.
      - name: Database types match the schema (G5)
        run: scripts/check-db-types.sh

      # pgTAP: triggers, RLS isolation, constraints, §11 edge cases.
      - name: DB tests (pgTAP)
        run: supabase test db

      # A public sign-up can never create staff or a platform admin
      # (20260927000200). HTTP, not pgTAP: the hole was GoTrue's /signup, and
      # pgTAP cannot act as the auth server's database role.
      - name: Sign-up trust (HTTP)
        run: supabase/tests/http/signup_trust.sh

      # Lock 2 of the injectable clock (20261006000300): the API's login role (authenticator) never pins
      # swimsync.now. A real login, not pgTAP — pgTAP cannot become authenticator (§7.333).
      - name: App clock locks (authenticator login)
        run: supabase/tests/http/app_clock_locks.sh

      # Deno: generate-invoices billing math + credit ledger. test.sh pulls
      # SERVICE_ROLE_KEY / API_URL from `supabase status`.
      - name: Engine tests (Deno)
        run: supabase/functions/generate-invoices/test.sh

      # RUN TWICE, deliberately. A completing run SEALS its billing month by
      # writing billing_periods, so a suite that leaks one row passes the first
      # time and short-circuits on "already_complete" the second (gotcha §7.15 —
      # this has already happened once). teardown() clears the months its
      # sessions fall in; this step is what proves it still does.
      - name: Engine tests (Deno) — second run, proves no leaked state
        run: supabase/functions/generate-invoices/test.sh

      # Loads every UI fixture, unloads it, and asserts the database came back.
      # Until 2026-08-01 NO fixture was ever applied by CI, and two classes of
      # breakage shipped through that gap — both found by accident:
      #   §7.62  a NOT NULL migration made two fixtures unloadable for a week
      #   §7.63  an unscoped CROSS JOIN enrolled every child in the database
      # psql's default hides both: it aborts the ONE failing statement and
      # carries on, so the fixture half-loads and the DRIVER's low score reads as
      # a product regression. The script runs with ON_ERROR_STOP=1 and compares
      # each fixture's row-count footprint alone vs stacked on its siblings.
      #
      # LAST, deliberately: it seeds and unseeds the whole database, so running
      # it before the billing suites would make a fixture bug look like a billing
      # failure. It restores what it found, so the ordering is a diagnosis
      # concern, not a correctness one.
      - name: UI fixtures load, own their own rows, and tear down clean
        run: .claude/skills/run-ui-playwright/drivers/check-fixture-roundtrip.sh

      - name: Stop Supabase stack
        if: always()
        run: supabase stop

  # Wave 8 (§7.348): a `types(…)` commit is RUNTIME-IDENTICAL, proven per commit by
  # transpiling every changed app file at C~1 and C with that app's own TypeScript.
  # Anything else must be labelled `fix(…)` (Bug-ledger row, failing-first test).
  runtime-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            SwimSyncApp/package-lock.json
            SwimSyncAdmin/package-lock.json

      - name: Install deps (each app's own TypeScript)
        run: |
          (cd SwimSyncApp && npm ci)
          (cd SwimSyncAdmin && npm ci)

      - name: Every types(…) commit is runtime-identical
        env:
          RANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$RANGE_BASE" || "$RANGE_BASE" =~ ^0+$ ]] || ! git cat-file -e "$RANGE_BASE^{commit}" 2>/dev/null; then
            RANGE_BASE="$RANGE_HEAD~1"
          fi
          rc=0; n=0
          while read -r sha subject; do
            [[ "$subject" =~ ^types\( ]] || continue
            n=$((n + 1))
            echo "::group::$sha $subject"
            scripts/check-runtime-identical.sh "$sha~1" "$sha" || rc=1
            echo "::endgroup::"
          done < <(git log --no-merges --format='%H %s' "$RANGE_BASE..$RANGE_HEAD")
          echo "checked $n types(…) commit(s) in $RANGE_BASE..$RANGE_HEAD"
          exit $rc

  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [SwimSyncAdmin, SwimSyncApp]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: ${{ matrix.app }}

      - name: Typecheck (tsc)
        run: npm run typecheck
        working-directory: ${{ matrix.app }}

      - name: Component / unit tests
        run: npm test
        working-directory: ${{ matrix.app }}
